name: Football Intelligence Autonomous Cloud

on:
  schedule:
    # Se ejecuta cada 25 minutos durante las franjas horarias de partidos europeos (11:00 a 22:55 UTC)
    - cron: '5,30,55 11-22 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze_and_notify:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Descargar codigo del repositorio
        uses: actions/checkout@v4

      - name: 2. Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 3. Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 4. Ejecutar Agentes (Bwin + Prepartido <3h + Directo)
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SPORTSCORE_API_KEY: ${{ secrets.SPORTSCORE_API_KEY }}
        run: |
          python scripts/github_runner.py

      - name: 5. Guardar base de datos SQLite actualizada
        run: |
          git config --local user.email "irasmikel@users.noreply.github.com"
          git config --local user.name "irasmikel"
          git add data/*.db || true
          git diff --staged --quiet || git commit -m "chore: actualizacion automatica Bwin y alertas SQLite [skip ci]"
          git push || true
