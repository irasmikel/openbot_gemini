name: Football Intelligence Autonomous Cloud

on:
  schedule:
    # Se ejecuta automaticamente cada 3 horas todos los dias (08:00, 11:00, 14:00, 17:00, 20:00, 23:00 UTC)
    - cron: '0 8,11,14,17,20,23 * * *'
  workflow_dispatch: # Permite lanzarlo manualmente con un boton desde la web de GitHub

permissions:
  contents: write

jobs:
  analyze_and_notify:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Descargar codigo del repositorio
        uses: actions/checkout@v4

      - name: 2. Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 3. Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 4. Ejecutar Agentes y Notificar a Telegram
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SPORTSCORE_API_KEY: ${{ secrets.SPORTSCORE_API_KEY }}
        run: |
          python scripts/github_runner.py

      - name: 5. Guardar base de datos SQLite actualizada en el repositorio
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/*.db || true
          git diff --staged --quiet || git commit -m "chore: actualizacion automatica de partidos y alertas SQLite [skip ci]"
          git push || true
